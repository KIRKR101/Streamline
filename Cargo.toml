[package]
name = "streamline"
version = "0.2.0"
edition = "2021"
description = "Simple, resumable, bidirectional file transfer with system tray and mDNS discovery"
license = "MIT"

[features]
default = ["tray", "discovery"]
tray = ["dep:tray-icon", "dep:notify-rust", "dep:rfd"]
discovery = ["dep:mdns-sd"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
indicatif = "0.17"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tray-icon = { version = "0.11", optional = true }
notify-rust = { version = "4", optional = true }
rfd = { version = "0.14", optional = true, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mdns-sd = { version = "0.11", optional = true }
hostname = "0.4"
bitflags = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
